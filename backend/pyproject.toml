[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer_services"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.5",
    "pydantic>=2.13.5",
    "uv>=0.9.8",
    "httpx>=0.28.1",
    "supabase>=2.31.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
package = true


